<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3C!-- Arch / Vault --%3E%3Cpath d='M8 28V14C8 8.477 11.582 4 16 4C20.418 4 24 8.477 24 14V28' fill='none' stroke='%231C3F35' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C!-- Citrine Diamond --%3E%3Cpath d='M16 11L19 16L16 21L13 16L16 11Z' fill='%23FF7A00'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Citrine Vault — Premium Wealth Management. California Organic Luxury." />
    <!-- PWA: цвет системной строки и иконка установки на iOS. Манифест
         подключает vite-plugin-pwa автоматически. -->
    <meta name="theme-color" content="#1C3F35" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Citrine" />
    <title>Citrine Vault</title>
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('theme');
          const supportDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === 'dark' || (!theme && supportDarkMode)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Typography: sans/serif — системные шрифты; из Google Fonts грузим только
         реально используемый Space Mono (font-mono вне macOS). Cormorant Garamond
         и Plus Jakarta Sans нигде не применялись — аудит июль 2026. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#FDFBF7] dark:bg-[#050505] text-[#1C3F35] dark:text-white transition-colors duration-500">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
