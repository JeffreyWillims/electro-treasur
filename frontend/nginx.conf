server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;

    # Импорт выписок/чеков (CSV/Excel) — бэкенд принимает до 10 МБ.
    # Без этого nginx режет загрузку по умолчанию на 1 МБ (413).
    client_max_body_size 10m;

    # Сжатие текстовых ассетов — ускоряет загрузку JS/CSS в разы.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1000;

    location /assets/ {
        try_files $uri =404;
        # Хэшированные имена файлов Vite → можно кэшировать навсегда.
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker и его регистратор НЕ кэшируем: иначе новая сборка
    # не «долетит» до установленного PWA — браузер продолжит крутить старый SW.
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location = /registerSW.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /admin {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
