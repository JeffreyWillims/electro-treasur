# ── Rate-limit для /api (http-контекст: файл включается внутрь http{}) ────────
# Сетевой rubber-band поверх приложенческого slowapi: грубо режет флуд по IP
# ещё до FastAPI. Ключ — $binary_remote_addr (после real_ip это реальный IP
# клиента, а не Cloudflare). Зона 10m ≈ 160k уникальных IP.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

server {
    listen 80;
    server_name citrinevault.ru www.citrinevault.ru 212.193.26.26 localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name citrinevault.ru www.citrinevault.ru;

    ssl_certificate /etc/letsencrypt/live/citrinevault.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/citrinevault.ru/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;

    # ── real_ip для Cloudflare ────────────────────────────────────────────────
    # Если сайт проксируется через Cloudflare, $remote_addr — это IP CF, а не
    # клиента; без этого rate-limit и логи считали бы всех за один IP. Доверяем
    # только диапазонам CF и берём реальный IP из CF-Connecting-IP. Если CF не
    # используется — директивы безвредны: прямой клиент не попадает в диапазоны.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # ── Security-заголовки ────────────────────────────────────────────────────
    # ВНИМАНИЕ (особенность nginx): add_header НЕ наследуется в location, где есть
    # свой add_header. Поэтому набор продублирован в `location /` (HTML-оболочка).
    # Здесь он покрывает ответы без своего add_header (/api/, /admin и ошибки).
    # HSTS — год + поддомены. CSP: 'unsafe-inline' для script/style — вынужденная
    # уступка бутстрапу Vite/PWA (инлайн-регистрация SW); ужесточается nonce'ами
    # отдельной задачей. Клик-джекинг закрыт frame-ancestors + X-Frame-Options.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Docker embedded DNS. Без resolver nginx резолвит `backend` один раз на
    # старте и держит IP навсегда → при пересоздании контейнера backend
    # (deploy) IP меняется, nginx стучится в старый → 502 на весь API.
    # valid=10s заставляет перечитывать запись, ipv6=off — у нас только v4.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Импорт выписок/чеков (CSV/Excel) — бэкенд принимает до 10 МБ.
    # Без этого nginx режет загрузку по умолчанию на 1 МБ (413).
    client_max_body_size 10m;

    # Сжатие текстовых ассетов — ускоряет загрузку JS/CSS в разы.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1000;

    # Ассеты с хешем в имени (Vite) неизменяемы — кэшируем на год.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker и PWA-оболочка: НИКОГДА не кэшировать. Иначе installed-PWA
    # после деплоя продолжает крутить старый sw.js/код (та самая боль stale SW).
    # sw.js сам управляет кэшем ассетов, поэтому ему нужен свежий ответ всегда.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
        access_log off;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
        access_log off;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        expires off;
    }

    location / {
        # index.html (оболочка SPA) не кэшируем — иначе браузер тянет старую
        # оболочку со ссылками на уже удалённые чанки. Ассеты хешированы отдельно.
        add_header Cache-Control "no-cache";
        # Дубль security-заголовков: свой add_header выше «перебивает» серверные,
        # а именно HTML-документу они нужнее всего (клик-джекинг, HSTS, CSP).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Грубый сетевой лимит поверх slowapi: burst=40 гасит короткие всплески
        # (дашборд шлёт пачку запросов), nodelay — не растягивает их во времени.
        limit_req zone=api_limit burst=40 nodelay;
        # Имя backend в переменную → nginx резолвит его через resolver в рантайме
        # (см. resolver выше), а не кэширует IP навсегда. rewrite снимает префикс
        # /api/ (при proxy_pass с переменной автоснятия префикса не происходит).
        set $api_backend backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin {
        set $admin_backend backend:8000;
        proxy_pass http://$admin_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
