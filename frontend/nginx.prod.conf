server {
    listen 80;
    server_name citrinevault.ru www.citrinevault.ru 212.193.26.26 localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name citrinevault.ru www.citrinevault.ru;

    ssl_certificate /etc/letsencrypt/live/citrinevault.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/citrinevault.ru/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires max;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
