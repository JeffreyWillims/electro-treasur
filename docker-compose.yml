services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: electro
      # Пароль берётся из root .env (см. .env.example) — в git не хардкодим.
      # ВНИМАНИЕ: POSTGRES_PASSWORD применяется только при ПЕРВОЙ инициализации
      # пустого тома pg_data. Для уже существующей БД пароль в томе не меняется —
      # менять его надо через ALTER USER. Задать до первого прод-деплоя.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: electro_treasur

    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U electro -d electro_treasur"]
      interval: 5s
      timeout: 3s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: always
    environment:
      LISTEN_PORT: 6432
      DB_USER: electro
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      DB_HOST: postgres
      DATABASES: "electro_treasur=host=postgres port=5432 auth_user=electro"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 10000
      DEFAULT_POOL_SIZE: 200
      AUTH_TYPE: scram-sha-256

    depends_on:
      postgres:
        condition: service_healthy
    # Проверяем, что пулер реально принимает соединения на 6432 (а не просто
    # что процесс жив). pg_isready есть в образе (libpq). Пароль не нужен —
    # проверяется только доступность listener'а.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U electro || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine

    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - backend/.env
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"     # Единственный открытый порт (HTTP)
      - "443:443"   # Единственный открытый порт (HTTPS)
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  telegram-bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m src.infrastructure.telegram.bot
    env_file:
      - backend/.env
    depends_on:
      pgbouncer: # 🛠 ТЕПЕРЬ БОТ ЖДЕТ PGBOUNCER ВМЕСТО POSTGRES
        condition: service_started
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true  # у бота нет HTTP-сервера; healthcheck образа на :8000 давал бы ложный fail
    dns:
      - 8.8.8.8
      - 1.1.1.1

  arq-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python run_arq.py
    env_file:
      - backend/.env
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true  # у воркера нет HTTP-сервера; healthcheck образа на :8000 давал бы ложный fail

volumes:
  pg_data:
  redis_data:
