# ─────────────────────────────────────────────────────────────
#  pytest.ini — E2E Test Suite Configuration
#  Isolated from backend/tests — zero cross-contamination.
# ─────────────────────────────────────────────────────────────
[pytest]

# Auto-discover test files only within this service boundary
testpaths = tests

# Naming conventions (Playwright-standard)
python_files  = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio mode for async Playwright tests
asyncio_mode = auto

# Default CLI options:
#   -v  → verbose output (show each test name)
#   -s  → don't capture stdout (see print() in tests)
addopts = -v -s

# Markers — used to categorise and filter tests
markers =
    smoke:      Fast sanity checks — run on every commit
    auth:       Authentication & authorisation flows
    dashboard:  Dashboard & data-display scenarios
    regression: Full regression suite

# Browser to use by default (can override via --browser=firefox / --browser=webkit)
# Set via pytest-playwright CLI flag — no ini key needed
