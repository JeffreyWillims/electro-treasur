###############################################################################
# Citrine Vault — единый пайплайн CI/CD
#
# Один пайплайн вместо backend_tests.yml + production.yml.
#
# Джобы:
#   1. lint       — ruff check, ruff format --check, mypy (backend)
#   2. frontend   — tsc --noEmit, vite build (frontend)
#   3. test       — PostgreSQL 16 + pytest unit/integration + coverage ≥ 70%
#   4. build      — Docker multi-stage → push в GHCR (только при push в main)
#
# Concurrency: автоматически отменяет предыдущие запуски для той же ветки/PR.
###############################################################################

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

# ═══════════════════════════════════════════════════════════════════════════════
jobs:

  # ── 1. Статический анализ бэкенда ──────────────────────────────────────────
  lint:
    name: 🔍 Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy type check
        run: mypy src/

      - name: Security audit (pip-audit)
        # PYSEC-2026-1325 (ecdsa, Minerva timing attack): фикса нет и не планируется —
        # апстрим считает side-channel вне модели угроз; ecdsa тянется через python-jose.
        run: |
          pip install pip-audit
          pip-audit --desc -r requirements.txt --ignore-vuln PYSEC-2026-1325

  # ── 2. Проверка сборки фронтенда ───────────────────────────────────────────
  frontend:
    name: ⚛️ Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build production bundle
        run: npm run build

  # ── 3. Тесты бэкенда (Unit + Integration) ──────────────────────────────────
  test:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: electro
          POSTGRES_PASSWORD: electro_secret
          POSTGRES_DB: electro_treasur_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U electro"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      ET_DATABASE_URL: postgresql+asyncpg://electro:electro_secret@localhost:5432/electro_treasur_test
      ET_SECRET_KEY: ci-test-secret-key-not-for-production-00000000
      ET_REDIS_URL: redis://localhost:6379/15
      ET_TELEGRAM_BOT_TOKEN: "fake:token"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies (Tesseract OCR)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-rus

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ".[dev]"

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U electro; do
            echo "Waiting for postgres..."
            sleep 2
          done

      - name: Run tests (Unit + Integration)
        run: |
          pytest tests/unit tests/integration \
            -v \
            --tb=short \
            -m "not e2e" \
            --junitxml=test-results.xml \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            backend/test-results.xml
            backend/coverage.xml
          retention-days: 30

  # ── 4. Сборка и пуш Docker-образа в GHCR ───────────────────────────────────
  build:
    name: 🐳 Build & Push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, frontend]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Кеш type=gha работает только с buildx-драйвером (docker-container),
      # дефолтный docker-драйвер падает с «Cache export is not supported».
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 5. Непрерывный деплой → VPS ─────────────────────────────────────────────
  # Требуемые GitHub Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PROJECT_DIR.
  # Порядок внутри скрипта — expand-фаза zero-downtime деплоя:
  # образы тянутся заранее, миграции (backward-compatible!) применяются НОВЫМ
  # образом, пока старые контейнеры ещё обслуживают трафик, и только потом
  # происходит переключение. Откат = pull предыдущего sha-тега + up -d.
  deploy:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build]

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            cd "${{ secrets.VPS_PROJECT_DIR }}"
            git pull origin main
            # 1. Готовый артефакт из GHCR (Immutable Infrastructure)
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull backend arq-worker telegram-bot
            # 2. Миграции новым образом ДО переключения контейнеров
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm backend alembic upgrade head
            # 3. Frontend — статика, собирается на месте (CI его образ не пушит)
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build frontend
            # 4. Переключение на новые контейнеры
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            docker image prune -f
