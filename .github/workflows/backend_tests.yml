###############################################################################
# Citrine Vault — Backend CI Pipeline
#
# Triggers on push/PR to main. Runs:
#   1. Static analysis (ruff check, ruff format, mypy)
#   2. Unit tests (Hypothesis, FakeRepo — no DB needed)
#   3. Integration tests (PostgreSQL with Savepoint Isolation)
#
# Coverage gate: --cov-fail-under=70 (enforced via pyproject.toml addopts)
###############################################################################

name: Backend Tests

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend_tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: 🔍 Static Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy type check
        run: mypy src/

  test:
    name: 🧪 Tests (Unit + Integration)
    runs-on: ubuntu-latest
    needs: lint

    # ── PostgreSQL Service Container ─────────────────────────────────
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: electro
          POSTGRES_PASSWORD: electro_secret
          POSTGRES_DB: electro_treasur_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U electro"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # pytest-env in pyproject.toml overrides these, but we set them
      # here as a safety net for any code that reads os.environ directly.
      ET_DATABASE_URL: postgresql+asyncpg://electro:electro_secret@localhost:5432/electro_treasur_test
      ET_SECRET_KEY: ci-test-secret-key-not-for-production-00000000
      ET_REDIS_URL: redis://localhost:6379/15
      ET_TELEGRAM_BOT_TOKEN: "fake:token"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ".[dev]"

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U electro; do
            echo "Waiting for postgres..."
            sleep 2
          done

      - name: Run tests (Unit + Integration)
        run: |
          pytest tests/unit tests/integration \
            -v \
            --tb=short \
            -m "not e2e" \
            --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/test-results.xml
          retention-days: 14
