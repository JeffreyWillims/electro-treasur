# Оверлей мониторинга — Prometheus + Grafana + cAdvisor + экспортеры + Alertmanager.
# Использование: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# ⚠️ Все UI/метрики публикуются ТОЛЬКО на loopback (127.0.0.1): наружу их нет.
# Доступ с рабочей машины — через SSH-туннель, напр.:
#   ssh -L 3000:127.0.0.1:3000 user@server   # затем http://localhost:3000
# Prometheus скрапит экспортеры по внутренней docker-сети (по имени сервиса),
# поэтому loopback-привязка публикуемых портов на scraping не влияет.
#
# Grafana: креды берутся из root .env (GRAFANA_ADMIN_USER/PASSWORD) — дефолта
# admin/admin больше нет (пароль обязателен, иначе compose упадёт на старте).
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - cadvisor
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # Подстановка токена без секрета в git: по умолчанию — закоммиченная заглушка (алерты ВЫКЛ).
      # Включить реальную доставку одной переменной окружения, указывающей на файл с токеном:
      #   ALERTMANAGER_BOT_TOKEN_FILE=./monitoring/alertmanager/bot_token
      - ${ALERTMANAGER_BOT_TOKEN_FILE:-./monitoring/alertmanager/bot_token.example}:/etc/alertmanager/bot_token:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      # Обязательны из root .env — дефолта admin/admin больше нет. Регистрация
      # новых пользователей и анонимный доступ выключены явно.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    ports:
      - "127.0.0.1:9100:9100"
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      # Пароль БД из root .env — не хардкодим в git. sslmode=disable допустимо:
      # соединение идёт по закрытой внутренней docker-сети (порт postgres наружу
      # не публикуется).
      DATA_SOURCE_NAME: "postgresql://electro:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/electro_treasur?sslmode=disable"
    ports:
      - "127.0.0.1:9187:9187"
    depends_on:
      - postgres
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    environment:
      REDIS_ADDR: "redis://redis:6379"
    ports:
      - "127.0.0.1:9121:9121"
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
