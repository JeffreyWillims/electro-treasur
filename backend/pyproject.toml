[project]
name = "electro-treasur-backend"
version = "0.1.0"
description = "HighLoad Financial Tracker MVP — 100k CCU Orbital-Grade FinTech"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "alembic>=1.14.0",
    "redis[hiredis]>=5.2.0",
    "arq>=0.26.1",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.28.0",
    "slowapi>=0.1.9",
    "sqladmin>=0.20.0",
    "itsdangerous>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "pytest-env>=1.1.0",
    "httpx>=0.28.0",
    "factory-boy>=3.3.0",
    "hypothesis>=6.100.0",
    "ruff>=0.8.0",
    "mypy>=1.11.0",
    "types-passlib>=1.7.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=70"
markers = [
    "e2e: End-to-end Playwright tests (deselect with -m 'not e2e')",
]

[tool.pytest_env]
ET_DATABASE_URL = "postgresql+asyncpg://electro:electro_secret@localhost:5432/electro_treasur_test"
ET_SECRET_KEY = "test-secret-key-do-not-use-in-production-0000000000"
ET_REDIS_URL = "redis://localhost:6379/15"
ET_TELEGRAM_BOT_TOKEN = "fake:token"

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",
    "B008",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["migrations/", "tests/"]
plugins = ["pydantic.mypy"]
disallow_untyped_decorators = false
disallow_subclassing_any = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true