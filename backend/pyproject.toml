[project]
name = "electro-treasur-backend"
version = "0.1.0"
description = "HighLoad Financial Tracker MVP — 100k CCU Orbital-Grade FinTech"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "alembic>=1.14.0",
    "redis[hiredis]>=5.2.0",
    "arq>=0.26.1",
    "argon2-cffi>=23.1.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.1.0",
    # httpx намеренно НЕ в runtime-зависимостях: используется только тестами (см. dev)
    "slowapi>=0.1.9",
    "sqladmin>=0.20.0",
    "itsdangerous>=2.2.0",
    "aiogram>=3.4.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
    "pytesseract>=0.3.10",
    "Pillow>=10.2.0",
    "pdfplumber>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "pytest-env>=1.1.0",
    "httpx>=0.28.0",
    "factory-boy>=3.3.0",
    "hypothesis>=6.100.0",
    "ruff>=0.8.0",
    "mypy>=1.11.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: End-to-end Playwright tests (deselect with -m 'not e2e')",
]
filterwarnings = [
    # Сторонний pytesseract использует устаревший pkgutil.find_loader (Python 3.12).
    # Предупреждения из собственного кода (src/) НЕ подавляем.
    "ignore:'pkgutil.find_loader' is deprecated:DeprecationWarning:pytesseract",
]

[tool.pytest_env]
# skip_if_set: реальная переменная окружения (если задана) имеет приоритет,
# что позволяет локально указать другой хост/порт тестовой БД.
ET_DATABASE_URL = { value = "postgresql+asyncpg://electro:electro_secret@localhost:5432/electro_treasur_test", skip_if_set = true }
ET_SECRET_KEY = "test-secret-key-do-not-use-in-production-0000000000"
ET_REDIS_URL = "redis://localhost:6379/15"
# Rate-limiter в тестах — in-memory (реального Redis в тест-окружении/CI нет).
ET_RATELIMIT_STORAGE_URI = "memory://"
ET_TELEGRAM_BOT_TOKEN = "fake:token"
# Тесты ходят по http — Secure-cookie иначе не отправляется клиентом.
ET_COOKIE_SECURE = "false"

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",
    "B008",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["migrations/", "tests/"]
plugins = ["pydantic.mypy"]
disallow_untyped_decorators = false
disallow_subclassing_any = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true