route:
  receiver: telegram
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h

receivers:
  - name: telegram
    telegram_configs:
      # Secret-free: the bot token is read from a FILE, never committed.
      # By default the compose overlay mounts bot_token.example (a dummy) here,
      # so Alertmanager starts but delivery is effectively OFF. To ENABLE real
      # alerts, point ONE env var at a file holding your token, e.g.
      #   ALERTMANAGER_BOT_TOKEN_FILE=./monitoring/alertmanager/bot_token
      # (see monitoring/README.md) and set the numeric chat_id below.
      - bot_token_file: /etc/alertmanager/bot_token
        chat_id: 123456789  # ← your Telegram chat/channel id (not a secret)
        parse_mode: HTML
        send_resolved: true
