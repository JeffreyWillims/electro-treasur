route:
  receiver: telegram
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h

receivers:
  - name: telegram
    telegram_configs:
      # Без секрета в git: токен бота читается из ФАЙЛА, никогда не коммитится.
      # По умолчанию compose-оверлей монтирует сюда bot_token.example (заглушку),
      # поэтому Alertmanager стартует, но доставка фактически ВЫКЛЮЧЕНА. Чтобы ВКЛЮЧИТЬ
      # реальные алерты, укажи ОДНУ переменную окружения на файл со своим токеном, например
      #   ALERTMANAGER_BOT_TOKEN_FILE=./monitoring/alertmanager/bot_token
      # (см. monitoring/README.md) и задай числовой chat_id ниже.
      - bot_token_file: /etc/alertmanager/bot_token
        chat_id: 123456789  # ← id твоего Telegram-чата/канала (не секрет)
        parse_mode: HTML
        send_resolved: true
