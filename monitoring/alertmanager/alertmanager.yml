route:
  receiver: telegram
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h

receivers:
  - name: telegram
    telegram_configs:
      # TODO: replace with your real bot token + numeric chat id before relying on alerts.
      # The project already has a bot token in backend/.env (ET_TELEGRAM_BOT_TOKEN).
      # Do NOT commit a real token here.
      - bot_token: "REPLACE_WITH_BOT_TOKEN"
        chat_id: 123456789
        parse_mode: HTML
        send_resolved: true
